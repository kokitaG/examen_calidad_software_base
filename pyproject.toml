[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "examen-calidad-inventario"
version = "0.1.0"
description = "Proyecto base para el examen final de aseguramiento de calidad"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
include = ["inventario*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["inventario"]
branch = true

[tool.coverage.report]
show_missing = true
